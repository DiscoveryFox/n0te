[workspace]
resolver = "3"
members = ["crates/core", "crates/ffi", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
loro = "1.18"
uniffi = "0.32"
thiserror = "2"
blake3 = "1.8"
n0te-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
debug = false
