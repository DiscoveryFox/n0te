[workspace]
resolver = "3"
members = ["crates/core", "crates/desktop", "crates/ffi", "crates/pdf", "crates/platform", "crates/sync", "crates/uniffi-bindgen"]

[workspace.package]
edition = "2024"
version = "0.32.1"
publish = false

[workspace.dependencies]
loro = "1.18"
uniffi = "0.32"
thiserror = "2"
blake3 = "1.8"
n0te-core = { path = "crates/core" }
n0te-pdf = { path = "crates/pdf" }
n0te-platform = { path = "crates/platform" }
n0te-sync = { path = "crates/sync" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"  # keep symbols: uniffi-bindgen reads its metadata from them (APK copy is stripped)

[profile.bench]
debug = false

# Optimized but quick to rebuild (no fat LTO): for iterating on the desktop app and its
# headless measurements. `cargo build --profile fast -p n0te-desktop`.
[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
strip = false

# CI checks (build + tests share it): dependencies optimized (they come from the cache), the
# workspace's own crates barely, so a push builds in minutes rather than half an hour.
[profile.ci]
inherits = "dev"
debug = "line-tables-only"
incremental = false

[profile.ci.package."*"]
opt-level = 2

# The Windows and Linux programs of a release: fully optimized but with thin LTO (fat LTO with
# one codegen unit takes far too long for the desktop crates; the Android library keeps it).
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16
