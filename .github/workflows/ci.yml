# Checks every push and pull request: Rust on Linux (clippy, tests), the Windows programs for
# x64 and ARM64 (release builds, tests on x64), the Windows installer and zip from those builds,
# and the Android APK. Everything it builds is kept as a workflow artifact for a few days.
#
# No `cargo fmt --check`: the code base is not rustfmt-formatted (long lines on purpose).
name: CI

on:
  push:
    branches: [main]
    # Text-only changes don't need a build.
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/workflows/release.yml"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE", ".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  linux:
    name: Linux (clippy, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Test builds of the whole workspace with full debug info fill the runner's disk.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
    steps:
      - name: Room on the runner's disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost && df -h /
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: System libraries
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends pkg-config libwayland-dev libxkbcommon-dev
      - name: pdfium (pinned, hash-checked)
        run: scripts/fetch-pdfium.sh linux-x64
      - name: Clippy
        # Reports lints in the run; it does not fail the build (yet), deny-level ones included.
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets
      - name: Tests
        run: cargo test --locked --workspace

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          # Cross-compiled on the x64 runner (its MSVC has the ARM64 tools): works in private
          # repos too, where the windows-11-arm runners aren't free.
          - arch: arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: clang on PATH (ring needs it for ARM64)
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          if (Get-Command clang -ErrorAction SilentlyContinue) { clang --version; exit 0 }
          $llvm = 'C:\Program Files\LLVM\bin'
          if (-not (Test-Path "$llvm\clang.exe")) { throw "clang not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $llvm
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: pdfium (pinned, hash-checked)
        run: scripts/fetch-pdfium.sh win-${{ matrix.arch }}
      - name: Build n0te Laptop, n0te Tablet, n0te-sync
        # The "ci" profile (dependencies optimized and cached, own crates quick to build), shared
        # with the tests below. ARM64 is type-checked only here; release.yml builds it for real.
        run: |
          if [[ "${{ matrix.arch }}" == arm64 ]]; then
            cargo check --locked --profile ci --target ${{ matrix.target }} -p n0te-desktop -p n0te-sync --bins
          else
            cargo build --locked --profile ci --target ${{ matrix.target }} -p n0te-desktop -p n0te-sync --bins
          fi
      - name: Tests
        if: matrix.arch == 'x64'
        # The Windows port is in progress (phase 2: sync IPC, paths): failures show up in the run
        # but do not fail it yet. Make this blocking once the port is done.
        continue-on-error: true
        env:
          N0TE_PDFIUM_LIB: ${{ github.workspace }}\third_party\pdfium\win-x64\bin\pdfium.dll
          # The UI tests check German texts; the runner's Windows is English.
          N0TE_LANG: de
        run: cargo test --locked --no-fail-fast --profile ci --target ${{ matrix.target }} -p n0te-core -p n0te-pdf -p n0te-platform -p n0te-desktop -p n0te-sync
      - name: Collect the exes
        if: matrix.arch == 'x64'
        run: |
          out=target/${{ matrix.target }}/ci
          mkdir -p dist
          cp "$out/n0te.exe" dist/n0te-laptop.exe
          cp "$out/n0te-tablet.exe" "$out/n0te-sync.exe" dist/
          ls -l dist
      - uses: actions/upload-artifact@v4
        if: matrix.arch == 'x64'
        with:
          name: n0te-windows-${{ matrix.arch }}-exes
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 7

  windows-packages:
    name: Windows installer + zip
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: NSIS
        run: sudo apt-get update -q && sudo apt-get install -yq --no-install-recommends nsis
      - uses: actions/download-artifact@v4
        with:
          pattern: n0te-windows-*-exes
          path: exes
      - name: Package
        env:
          REQUIRE_INSTALLER: "1"
        run: |
          version="$(scripts/version.sh cargo)-dev.${GITHUB_RUN_NUMBER}"
          # The installer script is the same for both; CI packages the x64 build.
          packaging/windows/package.sh "$version" x64 exes/n0te-windows-x64-exes dist
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: n0te-windows-packages
          path: |
            dist/*-setup.exe
            dist/*-portable.zip
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: 27.2.12479018
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.0"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Android NDK ${{ env.NDK_VERSION }}
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Throwaway debug key
        # The build signs release APKs with ~/.android/debug.keystore when there is no release key;
        # a fresh runner has none yet.
        run: |
          mkdir -p ~/.android
          keytool -genkeypair -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 -noprompt
      - name: Build the APK
        # Signed with a throwaway debug key here: fine for testing, but the tablet's updater only
        # takes APKs signed like the installed app (see release.yml).
        working-directory: android
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: n0te-android-apk
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
