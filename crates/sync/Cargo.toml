[package]
name = "n0te-sync"
description = "n0te sync engine: own devices and guests over iroh, live presence, history"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "n0te-sync"
path = "src/main.rs"

[dependencies]
n0te-core.workspace = true
loro.workspace = true
thiserror.workspace = true
blake3.workspace = true
# No metrics / Apple datapath (size); portmapper stays (UPnP/NAT-PMP helps direct paths).
iroh = { version = "1.4", default-features = false, features = ["tls-ring", "portmapper"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "net", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
data-encoding = "2"
postcard = { version = "1", default-features = false, features = ["alloc"] }
bytes = "1"
libc = "0.2"

[build-dependencies]
# Windows resources of the exes (icon, version info, manifest): packaging/windows/resources.rs.
embed-resource = "3.0"
