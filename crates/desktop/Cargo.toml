[package]
name = "n0te-desktop"
description = "n0te laptop app (iced spike)"
edition.workspace = true
version.workspace = true
publish.workspace = true

# Two programs from one app: "n0te Laptop" (keyboard + mouse; `n0te`, n0te-laptop.exe on
# Windows) and "n0te Tablet" (pen + touch, the port of the Android tablet app).
[[bin]]
name = "n0te"
path = "src/main.rs"

[[bin]]
name = "n0te-tablet"
path = "src/bin/tablet.rs"

[dependencies]
n0te-core.workspace = true
n0te-pdf.workspace = true
n0te-platform.workspace = true
serde_json = "1"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "x11", "crisp", "thread-pool", "canvas", "advanced", "highlighter", "image", "qr_code", "svg"] }
raw-window-handle = "0.6"

# Touchpad gestures (pinch, glide after a swipe) straight from Wayland: winit has none on Linux.
# n0te Tablet's pen on Windows: WM_POINTER through a window subclass (tablet/pen.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_Pointer", "Win32_UI_Shell", "Win32_UI_TabletPC", "Win32_UI_WindowsAndMessaging"] }
# Handwriting search: the system's ink recognizer (tablet/recognize.rs).
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Foundation_Numerics", "UI_Input_Inking"] }
windows-collections = "0.3"
windows-numerics = "0.3"

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[dev-dependencies]
iced_test = "0.14"
png = "0.18"
