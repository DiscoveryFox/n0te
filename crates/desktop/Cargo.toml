[package]
name = "n0te-desktop"
description = "n0te laptop app (iced spike)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "n0te"
path = "src/main.rs"

[dependencies]
n0te-core.workspace = true
n0te-pdf.workspace = true
serde_json = "1"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "wayland", "x11", "crisp", "thread-pool", "canvas", "advanced", "highlighter", "image", "qr_code", "svg"] }
raw-window-handle = "0.6"

# Touchpad gestures (pinch, glide after a swipe) straight from Wayland: winit has none on Linux.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[dev-dependencies]
iced_test = "0.14"
png = "0.18"
