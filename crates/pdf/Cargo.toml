[package]
name = "n0te-pdf"
description = "PDF rendering, text extraction and annotated export for n0te (pdfium, loaded at run time)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
n0te-core.workspace = true
thiserror.workspace = true
# Dynamic binding only: we ship libpdfium.so ourselves (scripts/fetch-pdfium.sh) and load it by path.
# `thread_safe` puts every single pdfium call behind one process-wide mutex; see the crate docs.
pdfium-render = { version = "0.9.5", default-features = false, features = ["pdfium_latest", "thread_safe"] }
