[package]
name = "n0te-core"
description = "n0te notebook model, merging, ink geometry and storage (shared by tablet, laptop and phone)"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
loro.workspace = true
thiserror.workspace = true
blake3.workspace = true
# Handwriting line keys, the same as the Android app's (inklines::key).
sha1_smol = "1"
# Design files (designs.rs): read leniently, with errors people and AIs can act on.
serde_json = "1"

